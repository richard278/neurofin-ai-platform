services:
  postgres:
    image: postgres:18.4
    ports:
      - "127.0.0.1:${NF_PG_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${NF_PG_USER:?required}
      POSTGRES_PASSWORD: ${NF_PG_PASSWORD:?required}
      POSTGRES_DB: ${NF_PG_DATABASE:?required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - neurofin_pg_data:/var/lib/postgresql

volumes:
  neurofin_pg_data:
